[project]
name = "pynuki"
version = "1.6.3"
description = "Python bindings for nuki.io bridges"
readme = "README.md"
requires-python = ">=3.13,<4.0"
license = "GPL-3.0-only"
authors = [{ name = "Philipp Schmitt", email = "philipp@schmitt.co" }]
dependencies = [
    "requests>=2.27,<3",
    "pynacl>=1.5.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/pschmitt/pynuki"
Repository = "https://github.com/pschmitt/pynuki"

[dependency-groups]
dev = [
    "black>21.11b0",
    "flake8>=7.4,<7.5",
    "isort>5.8.0",
]

[tool.black]
line-length = 80

[tool.isort]
profile = "black"
line_length = 80

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
